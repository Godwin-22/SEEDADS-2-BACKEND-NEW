<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — SeedSAds</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-login-page">

<div class="admin-login-box">
  <div class="brand">
    <div class="brand-icon">🌱</div>
    <div class="brand-text">Seeds<span>Ads</span></div>
  </div>
  <h2>Welcome Back, Admin</h2>
  <p>Sign in to access your dashboard.</p>

  <form onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" placeholder="admin@seedsads.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Enter your password" required>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:13px;">
      <label style="display:flex;align-items:center;gap:8px;color:var(--admin-text-muted);cursor:pointer;">
        <input type="checkbox" style="width:16px;height:16px;accent-color:var(--admin-primary);">
        Remember me
      </label>
      <a href="#" style="color:var(--admin-primary);font-weight:600;">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:14px;">
      Sign In →
    </button>
  </form>

  <div style="text-align:center;margin-top:24px;font-size:13px;color:var(--admin-text-dim);">
    ← <a href="../index.html" style="color:var(--admin-text-muted);">Back to Website</a>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  // Simulate login - redirect to dashboard
  window.location.href = 'dashboard.html';
}
</script>

</body>
</html>
